<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나와 잘 맞는 짝꿍 봉사동물 찾기</title>
    <style>
        :root {
            --primary-color: #2b7a78;
            --secondary-color: #3aafa9;
            --accent-color: #feffff;
            --bg-color: #f4fcfc;
            --text-color: #2b2d42;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(43, 122, 120, 0.2);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .step-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-group {
            margin-bottom: 25px;
        }

        .question-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .option-btn {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--secondary-color);
            background: #f0fdf4;
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(43, 122, 120, 0.3);
        }

        .submit-btn:hover {
            background-color: #23615f;
        }

        /* 결과 화면 */
        #result-section {
            display: none;
        }

        .match-banner {
            background: #e6fffa;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .match-banner h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .animal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .animal-card {
            background: white;
            border: 1px solid #edf2f7;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .animal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            background: #e2e8f0;
            color: #4a5568;
            margin-bottom: 8px;
            margin-right: 4px;
        }

        .badge.duty { background: #ebf8ff; color: #3182ce; }
        .badge.status-n { background: #def7ec; color: #03543f; } /* 입양가능 */
        .badge.status-y { background: #fde8e8; color: #9b1c1c; } /* 입양완료 */

        .animal-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .animal-breed {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 12px;
        }

        .animal-story {
            font-size: 0.95rem;
            color: #4a5568;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-btn {
            background: #edf2f7;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #4a5568;
            transition: background 0.2s;
            width: 100%;
        }

        .detail-btn:hover {
            background: #cbd5e0;
        }

        .reset-btn {
            background: #718096;
            margin-top: 20px;
        }
        .reset-btn:hover { background: #4a5568; }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #a0aec0;
        }

        .modal-body h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .modal-body p {
            margin-bottom: 10px;
            color: #4a5568;
            font-size: 0.95rem;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🐾 나와 잘 맞는 짝꿍 봉사동물 찾기</h1>
        <p>국가를 위해 헌신한 은퇴·봉사동물 중 나와 가장 잘 맞는 소중한 평생 친구를 만나보세요.</p>
    </header>

    <!-- 설문 섹션 -->
    <div class="card" id="survey-section">
        <div class="step-title">✨ 나의 성향과 환경을 알려주세요</div>
        
        <div class="question-group">
            <label>1. 선호하는 친구들의 활동량과 성향은 어떤가요?</label>
            <div class="options" data-q="activity">
                <div class="option-btn selected" data-val="all">상관없음 / 두루두루 좋아함</div>
                <div class="option-btn" data-val="active">활발하고 에너지가 넘치는 친구</div>
                <div class="option-btn" data-val="calm">차분하고 얌전한 베테랑 친구</div>
            </div>
        </div>

        <div class="question-group">
            <label>2. 가장 중요하게 생각하는 교감 포인트는?</label>
            <div class="options" data-q="trait">
                <div class="option-btn selected" data-val="all">상관없음</div>
                <div class="option-btn" data-val="aeGyo">애교가 많고 스킨십을 좋아하는 친구</div>
                <div class="option-btn" data-val="smart">똑똑하고 훈련 습득이 빠른 친구</div>
                <div class="option-btn" data-val="social">다른 친구들과도 잘 지내는 사교적인 친구</div>
            </div>
        </div>

        <button class="submit-btn" onclick="findMatch()">내 짝꿍 동물 만나러 가기 🚀</button>
    </div>

    <!-- 결과 섹션 -->
    <div id="result-section">
        <div class="match-banner">
            <h2>🎉 환상의 케미를 자랑하는 추천 짝꿍 동물들입니다!</h2>
            <p>입양 대기 중인 든든하고 사랑스러운 친구들을 확인해보세요.</p>
        </div>

        <div class="animal-grid" id="animal-list">
            <!-- 자바스크립트로 동적 생성 -->
        </div>

        <button class="submit-btn reset-btn" onclick="resetSurvey()">다시 성향 테스트하기</button>
    </div>
</div>

<!-- 상세 정보 모달 -->
<div class="modal" id="detail-modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-body" id="modal-body">
            <!-- 동적 삽입 -->
        </div>
    </div>
</div>

<script>
    // 첨부된 CSV 원본 데이터를 기반으로 한 봉사동물 데이터베이스
    const animals = [
        { name: "금", breed: "라브라도 리트리버", color: "검정색", gender: "암컷", duty: "은퇴견", status: "N", story: "새까만 털이 빛나는 매력적인 친구! 쓰다듬어 준다면 발라당 누워 애교부리는 애교쟁이입니다. 언제나 꼬리가 빠지게 흔들면서 반겨주는 웃음 전도사예요." },
        { name: "노랑", breed: "비글", color: "흰색&갈색&탄", gender: "수컷", duty: "은퇴견", status: "N", story: "사람들과도 다른 친구들과도 잘 지내요. 혼자 있으면 차분하고 얌전하지만, 산책할 때는 즐겁게 뛰어놀 줄 아는 사랑스러운 친구입니다." },
        { name: "루이", breed: "라브라도 리트리버", color: "노란색", gender: "수컷", duty: "은퇴견", status: "N", story: "믿음직스럽고 온순한 성격을 가진 라브라도 리트리버 은퇴견입니다." },
        { name: "바크", breed: "마리노이즈", color: "흑갈색", gender: "암컷", duty: "폭발물탐지견", status: "N", story: "서울경찰특공대에서 폭발물 탐지임무를 수년간 수행하고 이제는 새로운 가족과 남은 여생을 보내고자 합니다." },
        { name: "마린", breed: "셰퍼드", color: "흑갈색", gender: "암컷", duty: "폭발물탐지견", status: "N", story: "서울경찰특공대에서 훌륭하게 임무를 완수하고 제2의 견생을 함께할 따뜻한 가족을 찾고 있습니다." },
        { name: "팀", breed: "셰퍼드", color: "흑갈색", gender: "암컷", duty: "폭발물탐지견", status: "N", story: "활발하며 장난과 운동을 좋아하는 듬직한 견입니다. 아픈 곳 없이 건강을 잘 유지해 왔습니다." },
        { name: "익산", breed: "비글", color: "흰색&갈색&탄", gender: "암컷", duty: "은퇴견", status: "N", story: "사회생활 만렙! 항상 밝은 에너지 뿜뿜하며 맛있는 거 많이 주실 좋은 사람을 기다리고 있어요~!" },
        { name: "브라보", breed: "비글", color: "흰색&갈색&탄", gender: "암컷", duty: "은퇴견", status: "N", story: "겉은 투박해 보여도 속은 따뜻한 상남자! 알고 보면 애교쟁이랍니다." },
        { name: "썬", breed: "마리노이즈", color: "흑갈색", gender: "암컷", duty: "은퇴견", status: "N", story: "인천경찰특공대에서 폭발물 탐지 임무를 완벽히 수행하는 등 국가에 헌신한 멋진 경찰견입니다." },
        { name: "은", breed: "라브라도 리트리버", color: "검정색", gender: "암컷", duty: "은퇴견", status: "N", story: "스킨십을 좋아하고 간식이 있다면 무엇이든 할 수 있는 뜬금 능력자! 같이 놀다 보면 미소가 지어지는 친구예요." },
        { name: "토르", breed: "라브라도 리트리버", color: "노란색", gender: "암컷", duty: "폭발물 탐지", status: "N", story: "광주경찰특공대에서 수많은 임무를 수행한 훌륭한 견입니다. 사람을 잘 따르고 애교가 많고 활력이 넘쳐요. (문의: 광주경찰특공대 062-609-3040)" },
        { name: "테드", breed: "라브라도 리트리버", color: "검정색", gender: "암컷", duty: "은퇴견", status: "Y", story: "사람을 매우 좋아하는 애교쟁이! 동그란 눈이 매력적인 베테랑 마약 탐지견입니다. 공놀이와 산책을 좋아해요." },
        { name: "앤드", breed: "비글", color: "흰색&갈색&탄", gender: "암컷", duty: "은퇴견", status: "N", story: "검역물 꼼짝마! 탐지견 1등 공신 앤드! 차분하게 탐지요원과 호흡을 맞춰온 앤드가 새로운 보호자를 기다립니다." },
        { name: "국화", breed: "비글", color: "흰색&갈색&탄", gender: "수컷", duty: "은퇴견", status: "N", story: "혼자서도 잘 놀고 함께라도 잘 노는 알록달록 매력의 국화입니다!" },
        { name: "마리", breed: "잉글리쉬 스프링거 스파니엘", color: "검정&흰색", gender: "수컷", duty: "은퇴견", status: "N", story: "공 앞에서는 맑은 눈의 광인! 산책하며 에너지를 마음껏 발산하고 싶은 원더우먼 마리입니다." },
        { name: "우리", breed: "비글", color: "흰색&갈색&탄", gender: "수컷", duty: "은퇴견", status: "N", story: "우당탕탕 5남매 막내 공주! 오빠들 틈에서 사랑 많이 받으며 새침데기 아가씨로 폭풍 성장했어요." },
        { name: "한돌", breed: "라브라도 리트리버", color: "노란색", gender: "암컷", duty: "은퇴견", status: "Y", story: "짧은 다리에 긴 몸통의 매력! 만져주면 배를 보이며 애교를 부리고 공을 물고 잘 돌아오는 귀여운 친구입니다." },
        { name: "오리온", breed: "라브라도 리트리버", color: "노란색", gender: "수컷", duty: "은퇴견", status: "Y", story: "아주 활발하고 장난꾸러기인 파워 E! 공놀이와 터그를 좋아하고 앉아, 엎드려 교육이 잘 되어 있어요." },
        { name: "사랑", breed: "라브라도 리트리버", color: "검정색", gender: "수컷", duty: "은퇴견", status: "Y", story: "사람과 강아지 모두를 좋아하는 사교성 만점! 다양한 개인기를 할 수 있는 개인기 부자예요." },
        { name: "스카이", breed: "라브라도 리트리버", color: "검정색", gender: "암컷", duty: "은퇴견", status: "Y", story: "김해공항에서 일한 베테랑 마약탐지견! 친해지면 한없이 애교를 부리는 해맑고 귀여운 친구입니다." }
    ];

    // 선택 옵션 상태 관리
    const selections = {
        activity: 'all',
        trait: 'all'
    };

    // 옵션 버튼 클릭 이벤트 설정
    document.querySelectorAll('.options').forEach(group => {
        const qName = group.getAttribute('data-q');
        group.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selections[qName] = this.getAttribute('data-val');
            });
        });
    });

    function findMatch() {
        document.getElementById('survey-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        renderAnimals(animals);
    }

    function resetSurvey() {
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('survey-section').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAnimals(data) {
        const listContainer = document.getElementById('animal-list');
        listContainer.innerHTML = '';

        data.forEach((animal, index) => {
            const statusText = animal.status === 'N' ? '입양 대기중' : '입양 완료';
            const statusClass = animal.status === 'N' ? 'status-n' : 'status-y';

            const card = document.createElement('div');
            card.className = 'animal-card';
            card.innerHTML = `
                <div>
                    <div>
                        <span class="badge duty">${animal.duty}</span>
                        <span class="badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="animal-name">${animal.name} (${animal.gender})</div>
                    <div class="animal-breed">${animal.breed} | ${animal.color}</div>
                    <div class="animal-story">${animal.story}</div>
                </div>
                <button class="detail-btn" onclick="openModal(${index})">자세한 이야기 보기 📖</button>
            `;
            listContainer.appendChild(card);
        });
    }

    function openModal(index) {
        const animal = animals[index];
        const statusText = animal.status === 'N' ? '입양 대기중' : '입양 완료';
        
        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
            <h3>🐾 ${animal.name} (${animal.gender})</h3>
            <p><strong>품종:</strong> ${animal.breed} (${animal.color})</p>
            <p><strong>담당 업무:</strong> ${animal.duty}</p>
            <p><strong>입양 상태:</strong> ${statusText}</p>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">
            <p><strong>소개 및 스토리:</strong><br>${animal.story}</p>
            ${animal.extra ? `<p style="margin-top:10px; color:#e53e3e;"><strong>기타 안내:</strong> ${animal.extra}</p>` : ''}
        `;
        document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detail-modal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('detail-modal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }
</script>

</body>
</html>
